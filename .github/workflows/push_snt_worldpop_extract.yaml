name: Push snt_worldpop_extract

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/push_snt_worldpop_extract.yaml"
      - "snt_worldpop_extract/pipeline.py"
      - "snt_worldpop_extract/requirements.txt"
      - "snt_worldpop_extract/readme.md"
      - "snt_worldpop_extract/worlpopclient.py"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: "pip"
          cache-dependency-path: "snt_worldpop_extract/requirements.txt"

      - name: Configure OpenHEXA CLI
        uses: blsq/openhexa-cli-action@v1
        with:
          workspace: "snt-development"
          token: ${{ secrets.OH_TOKEN }}

      - name: Push pipeline to OpenHEXA
        run: |
          openhexa pipelines push snt_worldpop_extract \
            --code "snt-worldpop-extract" \
            --description "${{ github.event.head_commit.message }}" \
            --link "https://github.com/BLSQ/snt_development/commit/${{ github.sha }}" \
            --yes
